
name: StudyBuddy Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build StudyBuddy APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Firebase Configuration
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json is missing"
            exit 1
          fi

          python3 -c "
          import json
          with open('app/google-services.json') as f:
              data = json.load(f)
          clients = data.get('client', [])
          valid = any(
              oauth.get('client_type') == 3
              for client in clients
              for oauth in client.get('oauth_client', [])
          )
          if not valid:
              raise SystemExit(
                  'ERROR: Missing Web OAuth client (client_type 3). '
                  'Update google-services.json from Firebase.'
              )
          print('Firebase configuration validated.')
          "

      - name: Grant Gradle Permissions
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload StudyBuddy APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
