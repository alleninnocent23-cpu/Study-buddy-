
name: Build StudyBuddy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project and Gradle version
        id: project
        shell: bash
        run: |
          SETTINGS=$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle or settings.gradle.kts found."
            echo "Check that this repository contains an Android Gradle project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

          WRAPPER=$(find "$PROJECT_DIR" -type f \
            -path '*/gradle/wrapper/gradle-wrapper.properties' \
            | head -n 1)

          VERSION=""
          if [ -n "$WRAPPER" ]; then
            VERSION=$(sed -n \
              's/.*gradle-\([0-9][0-9.]*\)-\(bin\|all\)\.zip.*/\1/p' \
              "$WRAPPER" | head -n 1)
          fi

          echo "version=${VERSION:-8.10.2}" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.project.outputs.version }}

      - name: Build debug APK
        run: gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-APK
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: error
          retention-days: 7
