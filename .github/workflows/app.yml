name: App Build & Release (StudyBuddy)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - debug
          - release

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build StudyBuddy APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK_DIR/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$SDK_DIR/licenses/android-sdk-preview-license"
          printf '\nd975f751698a77b662f1254ddbeed3901e976f5a' > "$SDK_DIR/licenses/intel-android-extra-license"
          printf '\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a' > "$SDK_DIR/licenses/google-gdk-license"
          printf '\ne9acab5b5fbb560a72cfaecce8946896ff6aab9d' > "$SDK_DIR/licenses/mips-android-sysimage-license"
          for SDKM in "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$SDKM" ]; then
              yes | "$SDKM" --licenses >/dev/null 2>&1 || true
              break
            fi
          done
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore or Generate Keystores
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -s "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p app
          cp debug.keystore app/debug.keystore 2>/dev/null || true

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > my-upload-key.jks
          elif [ ! -s "my-upload-key.jks" ]; then
            keytool -genkeypair -noprompt \
              -keystore my-upload-key.jks \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Upload,O=Android,C=US"
          fi
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> "$GITHUB_ENV"

      - name: Configure Google Services & Env
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_APPLET_CONFIG_XML: ${{ secrets.FIREBASE_APPLET_CONFIG_XML }}
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'both' }}
        run: |
          set -e
          mkdir -p app app/src/main/res/values
          if [ -n "$GOOGLE_SERVICES_JSON" ] && ! printf '%s' "$GOOGLE_SERVICES_JSON" | grep -qE 'ci-build-placeholder|dummy_key_for_ci_build|remixed-project-id'; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ ! -s "app/google-services.json" ]; then
            echo "ERROR: app/google-services.json is missing from the repository and secrets.GOOGLE_SERVICES_JSON is not set."
            echo "Push app/google-services.json and app/src/main/res/values/firebase_applet_config.xml from AI Studio to GitHub, or set GOOGLE_SERVICES_JSON (and FIREBASE_APPLET_CONFIG_XML if missing) in GitHub Secrets."
            exit 1
          fi
          if [ -n "$FIREBASE_APPLET_CONFIG_XML" ]; then
            printf '%s\n' "$FIREBASE_APPLET_CONFIG_XML" > app/src/main/res/values/firebase_applet_config.xml
          fi

          python3 - << 'PY'
          import json
          import os
          import xml.etree.ElementTree as ET

          with open('app/google-services.json') as f:
              data = json.load(f)

          project_id = data.get('project_info', {}).get('project_id', '')
          clients = data.get('client', [])
          api_keys = [
              k.get('current_key', '')
              for c in clients
              for k in c.get('api_key', [])
          ]
          has_web_oauth = any(
              oauth.get('client_type') == 3
              for c in clients
              for oauth in c.get('oauth_client', [])
          )

          if not has_web_oauth:
              raise SystemExit('ERROR: Missing Web OAuth client (client_type 3) in app/google-services.json')

          placeholders = {'ci-build-placeholder', 'dummy_key_for_ci_build', ''}
          if project_id in ('studybuddy-app', 'remixed-project-id', '') or not api_keys or any(k in placeholders for k in api_keys):
              raise SystemExit(
                  'ERROR: app/google-services.json contains a placeholder Firebase project/API key. '
                  'Commit the provisioned app/google-services.json from AI Studio or update the GOOGLE_SERVICES_JSON secret.'
              )

          build_type = os.environ.get('BUILD_TYPE', 'both')
          if build_type in ('release', 'both'):
              cfg_path = 'app/src/main/res/values/firebase_applet_config.xml'
              if not os.path.exists(cfg_path):
                  raise SystemExit(
                      f'ERROR: Missing {cfg_path} (required for Release Firebase App Check recaptcha_site_key).'
                  )
              root = ET.parse(cfg_path).getroot()
              site_key = ''
              for elem in root.findall('string'):
                  if elem.attrib.get('name') == 'recaptcha_site_key':
                      site_key = (elem.text or '').strip()
              if not site_key:
                  raise SystemExit(f'ERROR: recaptcha_site_key is empty or missing in {cfg_path}.')

          print('Validated app/google-services.json and App Check configuration successfully.')
          PY

          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi

      - name: Prepare Gradle Wrapper
        shell: bash
        run: |
          set -e
          if [ -f "./gradlew" ] && [ -s "./gradle/wrapper/gradle-wrapper.jar" ]; then
            sed -i 's/\r$//' ./gradlew
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 9.3.1
            chmod +x ./gradlew
          fi

      - name: Build Android APK
        shell: bash
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'both' }}
        run: |
          set -e
          mkdir -p dist
          GRADLE_ARGS=(
            --no-daemon
            --stacktrace
            --max-workers=2
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          )

          if [ "$BUILD_TYPE" = "debug" ] || [ "$BUILD_TYPE" = "both" ]; then
            ./gradlew :app:assembleDebug "${GRADLE_ARGS[@]}"
            APK_DEBUG=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
            if [ -n "$APK_DEBUG" ] && [ -f "$APK_DEBUG" ]; then
              cp "$APK_DEBUG" dist/StudyBuddy-debug.apk
            else
              echo "ERROR: Debug APK not found"
              exit 1
            fi
          fi

          if [ "$BUILD_TYPE" = "release" ] || [ "$BUILD_TYPE" = "both" ]; then
            ./gradlew :app:assembleRelease "${GRADLE_ARGS[@]}"
            APK_RELEASE=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
            if [ -n "$APK_RELEASE" ] && [ -f "$APK_RELEASE" ]; then
              cp "$APK_RELEASE" dist/StudyBuddy-release.apk
            else
              echo "ERROR: Release APK not found"
              exit 1
            fi
          fi

          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          name: "StudyBuddy Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -e
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR/licenses"
          printf '\n8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > "$SDK_DIR/licenses/android-sdk-license"
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > "$SDK_DIR/licenses/android-sdk-preview-license"
          for SDKM in "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$SDKM" ]; then
              yes | "$SDKM" --licenses >/dev/null 2>&1 || true
              break
            fi
          done
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Cache Gradle Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare Environment & Wrapper
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          FIREBASE_APPLET_CONFIG_XML: ${{ secrets.FIREBASE_APPLET_CONFIG_XML }}
        run: |
          set -e
          if [ -s "debug.keystore.base64" ]; then
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore || rm -f debug.keystore
          fi
          if [ ! -s "debug.keystore" ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p app app/src/main/res/values
          if [ -n "$GOOGLE_SERVICES_JSON" ] && ! printf '%s' "$GOOGLE_SERVICES_JSON" | grep -qE 'ci-build-placeholder|dummy_key_for_ci_build|remixed-project-id'; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi
          if [ -n "$FIREBASE_APPLET_CONFIG_XML" ]; then
            printf '%s\n' "$FIREBASE_APPLET_CONFIG_XML" > app/src/main/res/values/firebase_applet_config.xml
          fi
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          if [ -f "./gradlew" ] && [ -s "./gradle/wrapper/gradle-wrapper.jar" ]; then
            sed -i 's/\r$//' ./gradlew
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 9.3.1
            chmod +x ./gradlew
          fi

      - name: Run Unit Tests
        shell: bash
        run: |
          ./gradlew :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            --max-workers=2 \
            "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
