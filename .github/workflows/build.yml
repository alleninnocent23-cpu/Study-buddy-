
name: Build StudyBuddy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Firebase configuration
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "ERROR: app/google-services.json is missing"
            exit 1
          fi

          PACKAGE_NAME="com.aistudio.studybuddy.xkjqmw"

          if ! grep -q "\"package_name\": \"$PACKAGE_NAME\"" app/google-services.json; then
            echo "ERROR: Firebase package name does not match."
            echo "Expected: $PACKAGE_NAME"
            exit 1
          fi

          echo "Firebase configuration verified."

      - name: Build StudyBuddy Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload StudyBuddy APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
