name: Build StudyBuddy APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ☕ Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 🐘 Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: 🔑 Restore or Generate Debug Keystore
        shell: bash
        run: |
          set -e
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Generating fresh debug.keystore..."
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p app
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: ⚙️ Configure Firebase & Environment Secrets
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          mkdir -p app

          # If user added GOOGLE_SERVICES_JSON as a GitHub Secret, use it
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Configured app/google-services.json from GitHub Secrets."
          elif [ ! -f "app/google-services.json" ]; then
            # Generate valid google-services.json matching both namespace and applicationId
            echo "Generating valid build google-services.json..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "100000000000",
              "project_id": "studybuddy-app",
              "storage_bucket": "studybuddy-app.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:studybuddy",
                  "android_client_info": {
                    "package_name": "com.aistudio.studybuddy.xkjqmw"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key_for_ci_build"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 1
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:100000000000:android:studybuddy_pkg",
                  "android_client_info": {
                    "package_name": "com.example"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key_for_ci_build"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

          # Setup .env for Secrets Gradle Plugin
          touch .env
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
          elif [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: 🔨 Grant Execute Permission for Gradlew
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: 🚀 Build StudyBuddy Debug APK
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: 📦 Locate and Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            cp "$APK_PATH" dist/StudyBuddy-debug.apk
            echo "Found and copied: $APK_PATH -> dist/StudyBuddy-debug.apk"
          else
            echo "ERROR: Debug APK was not found in app/build/outputs/apk/debug"
            find app/build/outputs -type f || true
            exit 1
          fi

      - name: 📤 Upload StudyBuddy APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyBuddy-Debug-APK
          path: dist/StudyBuddy-debug.apk
          if-no-files-found: error
          retention-days: 30
